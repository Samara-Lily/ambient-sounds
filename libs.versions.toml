[versions]
logback = "1.6.5"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
kotlinx-coroutines = "1.11.0"
toast = "1.0.5"
soundlibs-mp3spi = "1.9.5.4"
material3Adaptive = "1.3.0"

trayVersion = "2.1.7"
media3 = "1.11.1"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
k-toast = { module = "com.tarifchakder:ktoast", version.ref = "toast" }
soundlibs-mp3spi = { module = "com.googlecode.soundlibs:mp3spi", version.ref = "soundlibs-mp3spi" }
adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
tray = { module = "dev.nucleusframework:composenativetray", version.ref = "trayVersion" }
mediasessionservice = { module = "androidx.media3:media3-session", version.ref = "media3" }
exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }

